{% extends "base.html" %}
{% block judul %}{{ kode }}: {{ pesan }} | {{ nama }}{% endblock %}

{% block isi %}

<section class="hero" style="margin-top:26px">
  <div class="hero-isi">
    <p class="hero-label">GALAT {{ kode }}</p>
    <h1 class="hero-judul">{{ pesan }}</h1>
    <p class="hero-sub">{{ rinci }}</p>
    <div class="hero-aksi">
      <a class="tombol utama" href="/">Ke Beranda</a>
      <a class="tombol" href="/jelajah">Jelajah Novel</a>
    </div>
  </div>
</section>

{% if q %}
<section class="bagian">
  <div class="bagian-kepala"><h2>Coba cari</h2></div>
  <form class="filter" method="get" action="/cari">
    <input type="search" name="q" value="{{ q }}" placeholder="Judul atau penulis">
    <button class="tombol utama" type="submit">Cari</button>
  </form>
</section>
{% endif %}

{% endblock %}
