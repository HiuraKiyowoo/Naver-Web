{# Kartu novel — dipakai di rak & grid #}
<a class="kartu" href="{{ n.url }}">
  <div class="kartu-cover">
    {% if n.cover %}<img src="{{ n.cover }}" alt="Cover {{ n.judul }}" loading="lazy">
    {% else %}<div class="tanpa-cover">{{ n.judul[:1] }}</div>{% endif %}
    {% if n.rating and n.rating >= 1 %}<span class="lencana">★ {{ n.rating }}</span>
    {% elif n.jumlah_bab %}<span class="bab-pil">{{ n.jumlah_bab }} bab</span>{% endif %}
  </div>
  <p class="kartu-judul">{{ n.judul }}</p>
  <p class="kartu-meta">{{ n.jumlah_bab }} bab{% if n.penulis %} · {{ n.penulis }}{% endif %}</p>
</a>
